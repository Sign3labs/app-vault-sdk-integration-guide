buildscript {
    def creds = new Properties()
    rootProject.file("credentials.properties").withInputStream { creds.load(it) }
    // The appvault plugin is applied via a buildscript classpath dependency (same as sign3intelligence).
    // These repos are for the build-time classpath only and are exempt from FAIL_ON_PROJECT_REPOS.
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }   // brings the StringFog engine the plugin fronts
        maven {
            url "https://sign3.jfrog.io/artifactory/intelligence-generic-local/"
            credentials {
                username = creds.getProperty("jfrog.username")
                password = creds.getProperty("jfrog.password")
            }
        }
    }
    dependencies {
        // App Vault Gradle plugin, resolved from JFrog
        classpath 'com.sign3.app-vault:app-vault-plugin:1.0.0'
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

apply plugin: 'appvault'

import com.sign3.appvault.AppVaultMode

android {
    namespace 'com.sign3.appvaultintegration'
    compileSdk 36

    defaultConfig {
        applicationId "com.sign3.appvaultintegration"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    kotlinOptions {
        jvmTarget = '17'   // match the Java 17 compile target
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

appvault {
    // Cipher used to encrypt/decrypt strings (default: built-in AES-256-GCM cipher).
    implementation 'com.sign3.appvault.AppVaultCipher'
    // Master switch; turn off with: ./gradlew assembleDebug -PappvaultEnable=false
    enable = (findProperty('appvaultEnable') ?: 'true').toBoolean()
    // Only classes under these package prefixes get their string literals encrypted.
    fogPackages = ['com.sign3.appvaultintegration.config']
    // base64 = ciphertext as a string constant; AppVaultMode.bytes = raw byte array.
    mode AppVaultMode.base64
}

dependencies {
    // app-vault at RUNTIME (decrypts the fogged strings on-device). Resolved from JFrog.
    implementation 'com.sign3.app-vault:app-vault:1.0.0'

    // Jetpack Compose UI
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.10.0'
}

